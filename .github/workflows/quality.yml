name: Application quality
on:
  pull_request:
  push:
    branches: [dev, release, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep production hotfixes in dev and release
        if: github.ref_name == 'dev' || github.ref_name == 'release' || github.base_ref == 'dev' || github.base_ref == 'release'
        run: |
          git fetch origin master
          git merge-base --is-ancestor origin/master HEAD || {
            echo 'Integrate the current master hotfixes before promoting dev/release.'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SKIP_PRERENDER: '1'
      - run: npm run test:unit
      - run: npm run test:build
      - run: npm run test:smoke
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
