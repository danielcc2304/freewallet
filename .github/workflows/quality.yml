name: Application quality
on:
  pull_request:
  push:
    branches: [dev, release, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep production hotfixes in dev and release
        if: github.ref_name == 'dev' || github.ref_name == 'release' || github.base_ref == 'dev' || github.base_ref == 'release'
        run: |
          git fetch origin master
          git merge-base --is-ancestor origin/master HEAD || {
            echo 'Integrate the current master hotfixes before promoting dev/release.'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SKIP_PRERENDER: '1'
      - run: npm run test:unit
      - run: npm run test:build
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
  module-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SKIP_PRERENDER: '1'
      - run: npm run test:tailwind-modules-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-style-results
          path: |
            test-results
            /tmp/freewallet-tailwind-modules-after
          retention-days: 7
  verify:
    needs: [core, browser, module-styles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality group to pass
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STYLES_RESULT: ${{ needs['module-styles'].result }}
        run: test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success && test "$STYLES_RESULT" = success
